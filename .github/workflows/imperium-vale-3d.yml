name: Build Imperium Vale 3D

on:
  push:
    branches:
      - build/imperium-vale-3d
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        working-directory: imperium-3d
        run: gradle --no-daemon :android:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/imperium-3d/smoke-test.sh"

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imperium-vale-3d-smoke-screens
          path: |
            imperium-3d/smoke-menu.png
            imperium-3d/smoke-game.png
            imperium-3d/smoke-game-stress.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output
          cp imperium-3d/android/build/outputs/apk/debug/android-debug.apk \
            output/Imperium-Vale-3D-v0.6.0-alpha.apk
          sha256sum output/Imperium-Vale-3D-v0.6.0-alpha.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Imperium-Vale-3D-v0.6.0-alpha-apk
          path: output/Imperium-Vale-3D-v0.6.0-alpha.apk
          if-no-files-found: error
          retention-days: 7
